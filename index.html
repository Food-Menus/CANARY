<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="./assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css" />

</head>


  <body>
 
    <header class="header">
      <nav>
        <div class="nav__header">
          <div class="nav__logo">
            <a href="/index.html">
              <img
                src="assets/logo 2.png"
                alt="logo"
                class="nav__logo-white"
              />
            </a>
          </div>
          <div class="nav__menu__btn" id="menu-btn">
            <i class="ri-menu-line"></i>
          </div>
        </div>
        
        <ul class="nav__links" id="nav-links">
          <li><a href="#home">القائمة الرئيسية</a></li>
          <li><a href="#special">عروض خاصه</a></li>
          <li><a href="menu.html">قائمة الطعام</a></li>
          <li><a href="#event">EVENTS</a></li>
          <li><a href="#contact">تواصل معنا</a></li>
        </ul>
      </nav>
      
      <div class="section__container header__container" id="home">

        <div class="header__image">
          <img src="assets/logo.png" alt="header" />
        </div>


        <div class="header__content">
          <marquee direction="right" class="marquee" id="marquee">  </marquee>
          <br>
          <h2 ><a href="menu.html"> قائمة الطعام </a></h2>
          <br>
          <h1>اختار طلبك من قائمة الطعام <br>
            او
          <br>
          <span>ارفع الشاشه  </span></h1>
        </div>
        
      </div>
    </header>

    <h2 class="section__header" >عروض حصرية</h2>
    <p class="section__description" >استمتع باقوى العروض اللي متتفوتش</p>

    <section class="journey__grid" id="offers-container">
      <!-- سيتم إضافة العروض هنا -->
    </section>

    <section class="section__container event__container" id="event">
      <div class="event__content">       
        <div class="event__image">
          <img src="assets/event.png" alt="event" />
        </div>
        <div class="event__details">
          <h3 id="event-title" ></h3>
          <h2 class="section__header" id="event-date"></h2>
          <p class="section__description" id="event-description"></p>
        </div>

      </div>
    </section>

    <footer class="footer" id="contact">
      <div class="section__container footer__container">
        <div class="footer__logo">
          <img src="assets/logo 2.png" alt="logo" />
        </div>
        <div class="footer__content">
          <p id="about">
          </p>
          <div>
            <ul class="footer__links">
              <li>
                <span><i class="ri-map-pin-2-fill"></i></span>
              <p id="address"></p> 
              </li>
            </ul>
            <div class="footer__socials">
              <a href="https://www.facebook.com/canaryegy/"><i class="ri-facebook-circle-fill"></i></a>
            </div>
            <div class="footer__socials">
              <a ><i class="ri-phone-fill" id="mobile_phone_1"> </i></a>
            </div>
            <div class="footer__socials">
              <a ><i class="ri-phone-fill" id="mobile_phone_2"> </i></a>
            </div>
          </div>
        </div>
      </div>
      <div class="footer__bar">
        للأقتراحات والشكاوي 01062143230
      </div>
      <div class="footer__bar">
        Copyright © 2024 Techno Science. All rights reserved.
      </div>
    </footer>

    <script>
        const sheetID = '10QjIBcqruyffFdUhzsO_j_DGYq8bsN9eL0xVycAWZQM';
        const base = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

        async function fetchOffers() {
            const response = await fetch(base);
            const data = await response.text();
            const json = JSON.parse(data.substring(47).slice(0, -2));
            const offersContainer = document.getElementById('offers-container');
            offersContainer.innerHTML = '';

            json.table.rows.forEach((row, index) => {
                const offerName = row.c[0] ? row.c[0].v : 'غير متوفر';
                const offerDetails = row.c[1] ? row.c[1].v : 'غير متوفر';

                // إنشاء بطاقة العرض
                offersContainer.innerHTML += `
                    <div class="journey__card" onclick="toggleDetails(this)">
                        <div class="journey__card__bg">
                            <h4>${offerName}</h4>
                        </div>
                        <div class="journey__card__content" style="display: none;">
                            <h4>تفاصيل العرض:</h4>
                            <p>${offerDetails}</p>
                        </div>
                    </div>
                `;
            });
        }

        function toggleDetails(card) {
            const content = card.querySelector('.journey__card__content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        fetchOffers(); // استدعاء الدالة لتحميل البيانات
    </script>

    <script>
      const base2 = `https://docs.google.com/spreadsheets/d/1BUqZE3-dWtFJ5RqBqZpUQdv3M_k8igwdjje_sxNQXA4/gviz/tq?tqx=out:json`;

      async function fetchDetails() {
          const response = await fetch(base2);
          const data = await response.text();
          const json = JSON.parse(data.substring(47).slice(0, -2));

          // استدعاء البيانات من الصفوف
          const details = json.table.rows.map(row => row.c[0] ? row.c[0].v : 'غير متوفر');

          // وضع القيم في العناصر المناسبة
          document.getElementById('event-title').innerText = details[0]; // الحدث الكبير
          document.getElementById('event-date').innerText = details[1]; // في الفترة القادمة
          document.getElementById('event-description').innerText = details[2]; // تفاصيل الحدث
          document.getElementById('about').innerText = details[3]; // رسالة الترحيب
          document.getElementById('address').innerText = details[4]; // عنوان المطعم
          document.getElementById('mobile_phone_1').innerText = details[5]; // أرقام الهاتف
          document.getElementById('mobile_phone_2').innerText = details[6] || ''; // معلومات إضافية (إذا كانت موجودة)
          document.getElementById('marquee').innerText = details[7]; // الحدث الكبير
        }

      fetchDetails(); // استدعاء الدالة لتحميل البيانات
    </script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="main.js"></script>
    <script src="Data_Home_Page.json"></script>

  </body>
</html>
